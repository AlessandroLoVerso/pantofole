      <stop offset="0" stop-color="#1A1F3D"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="bagliore" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#FF8F3D" stop-opacity="0.5"/>
