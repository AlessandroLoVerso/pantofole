<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="notte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F3D"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="bagliore" cx="0.5" cy="0.9" r="0.65">
      <stop offset="0" stop-color="#FF8F3D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF8F3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alba" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6154"/>
      <stop offset="0.55" stop-color="#FF8F3D"/>
      <stop offset="1" stop-color="#FFC761"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#notte)"/>
  <rect width="1024" height="1024" fill="url(#bagliore)"/>

  <!-- onde NFC dalla punta -->
  <g fill="none" stroke="#FFE7C2" stroke-width="32" stroke-linecap="round">
    <path d="M 700 330 A 90 90 0 0 1 790 420"/>
    <path d="M 704 254 A 166 166 0 0 1 866 416" opacity="0.7"/>
    <path d="M 708 178 A 242 242 0 0 1 942 412" opacity="0.4"/>
  </g>

  <!-- suola -->
  <rect x="150" y="676" width="724" height="84" rx="42" fill="#FFE7C2"/>
  <rect x="150" y="730" width="724" height="30" rx="15" fill="#E9C59A"/>
  <!-- soletta interna, visibile dietro -->
  <rect x="176" y="652" width="420" height="40" rx="20" fill="#F2B98A"/>

  <!-- tomaia -->
  <path d="M 420 690
           C 420 560 520 470 650 466
           C 790 462 878 548 872 650
           C 871 674 862 690 840 690 Z" fill="url(#alba)"/>
  <!-- bordo morbido dell'apertura -->
  <path d="M 420 690 C 420 560 520 470 650 466" fill="none" stroke="#FFF1DC" stroke-width="40" stroke-linecap="round"/>
  <!-- cuciture -->
  <path d="M 500 640 C 560 600 700 590 820 620" fill="none" stroke="#FFF1DC" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 34" opacity="0.8"/>
</svg>
